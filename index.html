<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAR FUTSAL AI - Web Direct</title>
    
    <!-- SDK Firebase (V8 CDN Direct) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- TensorFlow.js & COCO-SSD Model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; text-align: center; margin: 0; padding: 15px; }
        h1 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 480px; margin: 0 auto 15px auto; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        button { background: #0284c7; color: white; border: none; padding: 12px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; margin: 6px 0; width: 100%; font-size: 0.95rem; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        button.danger { background: #e11d48; }
        button.danger:hover { background: #be123c; }
        button.success { background: #16a34a; }
        button.success:hover { background: #15803d; }
        .hidden { display: none !important; }
        .video-box { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; min-height: 240px; display: flex; align-items: center; justify-content: center; }
        video, img { width: 100%; height: auto; display: block; border-radius: 8px; }
        /* Canvas harus persis di atas gambar */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .status-badge { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; background: #334155; display: inline-block; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>⚽ VAR FUTSAL AI</h1>

    <!-- 1. MENU UTAMA -->
    <div id="menu" class="card">
        <h3>Pilih Peran Perangkat</h3>
        <button onclick="pilihPeran('kamera')">📱 Kamera Lapangan (HP)</button>
        <button onclick="pilihPeran('operator')">🎛️ Ruang Kontrol Wasit (Ada Scan AI)</button>
        <button onclick="pilihPeran('wasit')">📺 Monitor Wasit (Hanya Layar)</button>
    </div>

    <!-- 2. PANEL KAMERA -->
    <div id="panel-kamera" class="card hidden">
        <h3>📱 Kamera Lapangan</h3>
        <div class="video-box">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        <button onclick="mulaiKamera()" class="success">🟢 Mulai Live Stream</button>
        <button onclick="tukarKamera()">🔄 Ganti Kamera (Depan/Belakang)</button>
        <div id="status-cam" class="status-badge">Status: Siap</div>
    </div>

    <!-- 3. PANEL KONTROL WASIT (OPERATOR & AI) -->
    <div id="panel-operator" class="card hidden">
        <h3>🎛️ Ruang Kontrol Wasit (Operator)</h3>
        <div class="video-box">
            <img id="stream-operator" src="" alt="Menunggu Stream Kamera...">
            <canvas id="canvas-ai"></canvas>
        </div>
        <button id="btn-ai" onclick="toggleAI()" class="success">🔍 Aktifkan Scan AI</button>
        <button onclick="kirimKeWasit()" class="danger">📺 Kirim Tayangan ke Monitor Wasit</button>
        <div id="status-op" class="status-badge">Status: Menghubungkan Firebase...</div>
    </div>

    <!-- 4. PANEL MONITOR WASIT -->
    <div id="panel-wasit" class="card hidden">
        <h3>📺 Layar Monitor Wasit</h3>
        <div class="video-box">
            <img id="stream-wasit" src="" alt="Menunggu Keputusan Ruang Kontrol...">
        </div>
        <div id="status-wasit" class="status-badge">Status: Standby</div>
    </div>

<script>
    // ==========================================
    // CONFIG FIREBASE (SUDAH DIUPDATE)
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyDziA3_jPIQrBJvpAD2R25j4v55imMPB6g",
        authDomain: "var-ai-aldi.firebaseapp.com",
        databaseURL: "https://var-ai-aldi-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "var-ai-aldi",
        storageBucket: "var-ai-aldi.firebasestorage.app",
        messagingSenderId: "601520003339"
    };

    // Inisialisasi Firebase
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentStream = null;
    let isFacingUser = false;
    let modelAI = null;
    let isAIActive = false;
    let isDetecting = false; // Mencegah proses AI bertumpuk (crash)
    let cameraInterval = null;

    // --- NAVIGASI PERAN ---
    function pilihPeran(peran) {
        document.getElementById('menu').classList.add('hidden');
        if (peran === 'kamera') document.getElementById('panel-kamera').classList.remove('hidden');
        if (peran === 'operator') {
            document.getElementById('panel-operator').classList.remove('hidden');
            bacaStream('operator');
        }
        if (peran === 'wasit') {
            document.getElementById('panel-wasit').classList.remove('hidden');
            bacaStream('wasit');
        }
    }

    // --- FUNGSI KAMERA (HP) ---
    async function mulaiKamera() {
        const video = document.getElementById('webcam');
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        if (cameraInterval) clearInterval(cameraInterval);

        const mode = isFacingUser ? "user" : "environment";
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: mode, width: { ideal: 480 }, height: { ideal: 360 } },
                audio: false
            });
            currentStream = stream;
            video.srcObject = stream;
            document.getElementById('status-cam').innerText = "Status: Live Stream Aktif 🔴";

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 320; 
            canvas.height = 240;

            // Kirim Frame ke Firebase (~8 FPS)
            cameraInterval = setInterval(() => {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const frameData = canvas.toDataURL('image/jpeg', 0.4); // Kompresi 40%
                    db.ref('var/stream_kamera').set(frameData);
                }
            }, 125);

        } catch (err) {
            alert("Gagal Mengakses Kamera: Pastikan izin kamera diberikan.");
            console.error(err);
            document.getElementById('status-cam').innerText = "Error Akses Kamera";
        }
    }

    function tukarKamera() {
        isFacingUser = !isFacingUser;
        mulaiKamera();
    }

    // --- FUNGSI STREAMING (KONTROL WASIT & MONITOR WASIT) ---
    function bacaStream(peran) {
        const targetPath = peran === 'operator' ? 'var/stream_kamera' : 'var/stream_wasit';
        const imgElement = document.getElementById(peran === 'operator' ? 'stream-operator' : 'stream-wasit');
        const statusBadge = document.getElementById(peran === 'operator' ? 'status-op' : 'status-wasit');

        db.ref(targetPath).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                imgElement.src = data;
                statusBadge.innerText = "Status: Terhubung (Live) 🟢";
            }
        });
    }

    // --- FUNGSI KIRIM KE MONITOR WASIT ---
    function kirimKeWasit() {
        const currentFrame = document.getElementById('stream-operator').src;
        if (currentFrame && currentFrame.startsWith('data:image')) {
            db.ref('var/stream_wasit').set(currentFrame);
            alert("✅ Tayangan berhasil dikirim ke Layar Monitor Wasit!");
        } else {
            alert("❌ Sinyal kamera belum masuk atau masih kosong!");
        }
    }

    // --- FUNGSI SCAN AI (HANYA DI RUANG KONTROL WASIT) ---
    async function toggleAI() {
        const btn = document.getElementById('btn-ai');
        const canvas = document.getElementById('canvas-ai');
        const ctx = canvas.getContext('2d');

        // Mematikan AI
        if (isAIActive) {
            isAIActive = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            btn.innerText = "🔍 Aktifkan Scan AI";
            btn.className = "success";
            return;
        }

        // Mengaktifkan AI
        btn.innerText = "⏳ Memuat Model AI (Mohon Tunggu)...";
        if (!modelAI) {
            try {
                modelAI = await cocoSsd.load();
            } catch (err) {
                alert("Gagal memuat model AI. Pastikan koneksi internet stabil.");
                console.error(err);
                btn.innerText = "🔍 Aktifkan Scan AI";
                return;
            }
        }

        isAIActive = true;
        btn.innerText = "🛑 Matikan Scan AI";
        btn.className = "danger";
        jalankanDeteksiAI(); // Mulai loop deteksi
    }

    // Loop AI menggunakan async/await agar tidak membuat memori browser crash
    async function jalankanDeteksiAI() {
        if (!isAIActive) return; // Berhenti jika dimatikan

        const img = document.getElementById('stream-operator');
        const canvas = document.getElementById('canvas-ai');
        const ctx = canvas.getContext('2d');

        // Validasi gambar sudah masuk dan siap di-scan
        if (img.complete && img.naturalWidth !== 0 && !isDetecting) {
            isDetecting = true; // Kunci proses (agar tidak tumpang tindih)

            // Setel ukuran kanvas mengikuti ukuran asli gambar agar koordinat presisi
            canvas.width = img.clientWidth;
            canvas.height = img.clientHeight;

            try {
                const predictions = await modelAI.detect(img);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                predictions.forEach(pred => {
                    // Filter: Hanya deteksi yang relevan (person, sports ball) dengan skor > 40%
                    if (pred.score > 0.4 && (pred.class === 'person' || pred.class === 'sports ball')) {
                        const [x, y, width, height] = pred.bbox;
                        
                        // Perhitungan Skala CSS vs Natural Image
                        const scaleX = canvas.width / img.naturalWidth;
                        const scaleY = canvas.height / img.naturalHeight;

                        const scaledX = x * scaleX;
                        const scaledY = y * scaleY;
                        const scaledWidth = width * scaleX;
                        const scaledHeight = height * scaleY;

                        // Gambar Kotak
                        ctx.strokeStyle = pred.class === 'person' ? "#38bdf8" : "#facc15"; // Biru untuk orang, kuning untuk bola
                        ctx.lineWidth = 3;
                        ctx.strokeRect(scaledX, scaledY, scaledWidth, scaledHeight);

                        // Gambar Teks
                        ctx.fillStyle = pred.class === 'person' ? "#38bdf8" : "#facc15";
                        ctx.font = "bold 14px sans-serif";
                        ctx.fillText(
                            `${pred.class.toUpperCase()} (${Math.round(pred.score * 100)}%)`, 
                            scaledX, 
                            scaledY > 15 ? scaledY - 5 : 15
                        );
                    }
                });
            } catch (err) {
                console.error("Error saat deteksi AI:", err);
            }
            isDetecting = false; // Buka kunci proses
        }

        // Loop ke frame berikutnya secara otomatis
        requestAnimationFrame(jalankanDeteksiAI);
    }
</script>
</body>
</html>
