<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAR FUTSAL AI - Replay & Deteksi Kontak</title>
    
    <!-- SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- TensorFlow.js & COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0f172a; color: #f8fafc; text-align: center; margin: 0; padding: 15px; }
        h1 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 480px; margin: 0 auto 15px auto; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        button { background: #0284c7; color: white; border: none; padding: 12px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; margin: 6px 0; width: 100%; transition: 0.2s; }
        button:hover { background: #0369a1; }
        button.danger { background: #e11d48; }
        button.danger:hover { background: #be123c; }
        button.success { background: #16a34a; }
        button.success:hover { background: #15803d; }
        button.warning { background: #d97706; color: white; }
        .hidden { display: none !important; }
        .video-box { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; min-height: 240px; display: flex; align-items: center; justify-content: center; border: 2px solid #334155;}
        video, img { width: 100%; height: auto; display: block; border-radius: 8px; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .status-badge { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; background: #334155; display: inline-block; margin-top: 8px; }
        
        /* Animasi Peringatan Kontak Fisik */
        @keyframes kedip { 0% { border-color: #ef4444; box-shadow: 0 0 15px #ef4444; } 50% { border-color: #334155; box-shadow: none; } 100% { border-color: #ef4444; box-shadow: 0 0 15px #ef4444; } }
        .alert-kontak { animation: kedip 0.5s infinite; }
        #alert-text { color: #ef4444; font-weight: bold; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <h1>⚽ VAR FUTSAL AI (PRO)</h1>

    <!-- MENU UTAMA -->
    <div id="menu" class="card">
        <h3>Pilih Peran Perangkat</h3>
        <button onclick="pilihPeran('kamera')">📱 Kamera Lapangan (HP)</button>
        <button onclick="pilihPeran('operator')">🎛️ Ruang Kontrol & AI (Laptop)</button>
        <button onclick="pilihPeran('wasit')">📺 Monitor Wasit (Tablet/HP)</button>
    </div>

    <!-- PANEL KAMERA -->
    <div id="panel-kamera" class="card hidden">
        <h3>📱 Kamera Lapangan</h3>
        <div class="video-box"><video id="webcam" autoplay playsinline muted></video></div>
        <button onclick="mulaiKamera()" class="success">🟢 Mulai Live Stream</button>
        <button onclick="tukarKamera()">🔄 Ganti Kamera</button>
        <div id="status-cam" class="status-badge">Status: Siap</div>
    </div>

    <!-- PANEL KONTROL WASIT -->
    <div id="panel-operator" class="card hidden">
        <h3>🎛️ Ruang Kontrol Wasit</h3>
        <div class="video-box" id="box-operator">
            <img id="stream-operator" src="" alt="Menunggu Stream Kamera...">
            <canvas id="canvas-ai"></canvas>
        </div>
        <div id="alert-text">⚠️ POTENSI KONTAK FISIK TERDETEKSI!</div>
        <button id="btn-ai" onclick="toggleAI()" class="success">🔍 Aktifkan Scan AI</button>
        <button onclick="kirimReplay()" class="warning">⏪ Kirim Replay 2 Detik ke Wasit</button>
        <div id="status-op" class="status-badge">Status: Menghubungkan Firebase...</div>
    </div>

    <!-- PANEL MONITOR WASIT -->
    <div id="panel-wasit" class="card hidden">
        <h3>📺 Monitor Wasit (Replay Mode)</h3>
        <div class="video-box">
            <img id="stream-wasit" src="" alt="Menunggu Replay dari Kontrol...">
        </div>
        <div id="status-wasit" class="status-badge">Status: Standby</div>
    </div>

<script>
    // --- KONFIGURASI FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyDziA3_jPIQrBJvpAD2R25j4v55imMPB6g",
        authDomain: "var-ai-aldi.firebaseapp.com",
        databaseURL: "https://var-ai-aldi-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "var-ai-aldi",
        storageBucket: "var-ai-aldi.firebasestorage.app",
        messagingSenderId: "601520003339"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- VARIABEL GLOBAL ---
    let currentStream = null;
    let isFacingUser = false;
    let modelAI = null;
    let isAIActive = false;
    let isDetecting = false; 
    let cameraInterval = null;
    
    // Sistem Buffer Replay (Menyimpan 15 frame terakhir)
    const frameBuffer = [];
    const MAX_FRAMES = 15; 
    let wasitPlayInterval = null;

    // --- NAVIGASI PERAN ---
    function pilihPeran(peran) {
        document.getElementById('menu').classList.add('hidden');
        if (peran === 'kamera') document.getElementById('panel-kamera').classList.remove('hidden');
        if (peran === 'operator') {
            document.getElementById('panel-operator').classList.remove('hidden');
            bacaStreamLive(); // Operator baca live stream tunggal
        }
        if (peran === 'wasit') {
            document.getElementById('panel-wasit').classList.remove('hidden');
            bacaStreamReplay(); // Wasit menunggu array replay
        }
    }

    // --- 1. FUNGSI KAMERA (HP) ---
    async function mulaiKamera() {
        const video = document.getElementById('webcam');
        if (currentStream) currentStream.getTracks().forEach(track => track.stop());
        if (cameraInterval) clearInterval(cameraInterval);

        const mode = isFacingUser ? "user" : "environment";
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: mode, width: { ideal: 480 }, height: { ideal: 360 } },
                audio: false
            });
            currentStream = stream;
            video.srcObject = stream;
            document.getElementById('status-cam').innerText = "Status: Live Stream Aktif 🔴";

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 320; 
            canvas.height = 240;

            // Kirim Frame ke Firebase (~8 FPS)
            cameraInterval = setInterval(() => {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const frameData = canvas.toDataURL('image/jpeg', 0.4);
                    db.ref('var/live_stream').set(frameData); // Kirim ke node live_stream
                }
            }, 125);
        } catch (err) {
            alert("Gagal Akses Kamera.");
        }
    }

    function tukarKamera() { isFacingUser = !isFacingUser; mulaiKamera(); }

    // --- 2. FUNGSI OPERATOR (Menerima Live & Menyimpan Buffer Replay) ---
    function bacaStreamLive() {
        const imgElement = document.getElementById('stream-operator');
        const statusBadge = document.getElementById('status-op');

        db.ref('var/live_stream').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                imgElement.src = data;
                statusBadge.innerText = "Status: Terhubung (Live) 🟢";
                
                // Simpan frame ke dalam buffer untuk Replay
                frameBuffer.push(data);
                if (frameBuffer.length > MAX_FRAMES) {
                    frameBuffer.shift(); // Hapus frame tertua jika lebih dari 15
                }
            }
        });
    }

    // --- 3. FUNGSI KIRIM REPLAY KE WASIT ---
    function kirimReplay() {
        if (frameBuffer.length < 5) {
            alert("⏳ Menunggu lebih banyak frame terkumpul, tunggu sebentar...");
            return;
        }
        // Kirim SELURUH ARRAY buffer ke database
        db.ref('var/replay_wasit').set(frameBuffer);
        alert("✅ Replay Kejadian (15 Frame) dikirim ke Layar Monitor Wasit!");
    }

    // --- 4. FUNGSI WASIT (Memutar Ulang Array Frame layaknya Video/GIF) ---
    function bacaStreamReplay() {
        const imgElement = document.getElementById('stream-wasit');
        const statusBadge = document.getElementById('status-wasit');

        db.ref('var/replay_wasit').on('value', (snapshot) => {
            const frames = snapshot.val();
            if (frames && Array.isArray(frames)) {
                statusBadge.innerText = "Status: MEMUTAR REPLAY ⏪";
                
                // Hentikan pemutaran sebelumnya jika ada
                if (wasitPlayInterval) clearInterval(wasitPlayInterval);
                
                // Putar ulang frame berurutan (Loop)
                let i = 0;
                wasitPlayInterval = setInterval(() => {
                    imgElement.src = frames[i];
                    i++;
                    if (i >= frames.length) i = 0; // Ulangi dari awal
                }, 150); // Kecepatan putar ulang (150ms per frame = slow-mo sedikit)
            }
        });
    }

    // --- 5. FUNGSI SCAN AI & DETEKSI KONTAK FISIK ---
    async function toggleAI() {
        const btn = document.getElementById('btn-ai');
        const canvas = document.getElementById('canvas-ai');
        const ctx = canvas.getContext('2d');

        if (isAIActive) {
            isAIActive = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            btn.innerText = "🔍 Aktifkan Scan AI";
            btn.className = "success";
            hapusPeringatanKontak();
            return;
        }

        btn.innerText = "⏳ Memuat AI...";
        if (!modelAI) modelAI = await cocoSsd.load();

        isAIActive = true;
        btn.innerText = "🛑 Matikan Scan AI";
        btn.className = "danger";
        jalankanDeteksiAI(); 
    }

    // Logika Mendeteksi Benturan Bounding Box
    function cekTumpangTindih(box1, box2) {
        // [x, y, width, height]
        const x_overlap = Math.max(0, Math.min(box1[0] + box1[2], box2[0] + box2[2]) - Math.max(box1[0], box2[0]));
        const y_overlap = Math.max(0, Math.min(box1[1] + box1[3], box2[1] + box2[3]) - Math.max(box1[1], box2[1]));
        const areaOverlap = x_overlap * y_overlap;
        
        const areaBox1 = box1[2] * box1[3];
        // Jika overlap memakan lebih dari 15% dari ukuran tubuh pemain, anggap sebagai kontak fisik
        return (areaOverlap > (areaBox1 * 0.15)); 
    }

    function hapusPeringatanKontak() {
        document.getElementById('box-operator').classList.remove('alert-kontak');
        document.getElementById('alert-text').style.display = "none";
    }

    async function jalankanDeteksiAI() {
        if (!isAIActive) return;

        const img = document.getElementById('stream-operator');
        const canvas = document.getElementById('canvas-ai');
        const ctx = canvas.getContext('2d');

        if (img.complete && img.naturalWidth !== 0 && !isDetecting) {
            isDetecting = true; 
            canvas.width = img.clientWidth;
            canvas.height = img.clientHeight;

            try {
                const predictions = await modelAI.detect(img);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                let orangTerdeteksi = [];
                let adaKontak = false;

                const scaleX = canvas.width / img.naturalWidth;
                const scaleY = canvas.height / img.naturalHeight;

                predictions.forEach(pred => {
                    if (pred.score > 0.4 && (pred.class === 'person' || pred.class === 'sports ball')) {
                        const [x, y, w, h] = pred.bbox;
                        const scaledBox = [x * scaleX, y * scaleY, w * scaleX, h * scaleY];

                        // Kumpulkan data pemain untuk dicek benturannya
                        if(pred.class === 'person') orangTerdeteksi.push(scaledBox);

                        ctx.strokeStyle = pred.class === 'person' ? "#38bdf8" : "#facc15"; 
                        ctx.lineWidth = 2;
                        ctx.strokeRect(scaledBox[0], scaledBox[1], scaledBox[2], scaledBox[3]);
                    }
                });

                // Cek apakah ada kontak antar pemain
                if (orangTerdeteksi.length >= 2) {
                    for(let i=0; i<orangTerdeteksi.length; i++){
                        for(let j=i+1; j<orangTerdeteksi.length; j++){
                            if(cekTumpangTindih(orangTerdeteksi[i], orangTerdeteksi[j])){
                                adaKontak = true;
                            }
                        }
                    }
                }

                // Tampilkan Efek Alert jika Kontak Terdeteksi
                if (adaKontak) {
                    document.getElementById('box-operator').classList.add('alert-kontak');
                    document.getElementById('alert-text').style.display = "block";
                } else {
                    hapusPeringatanKontak();
                }

            } catch (err) {}
            isDetecting = false; 
        }
        // AI dipanggil otomatis secara kontinyu menggunakan requestAnimationFrame
        requestAnimationFrame(jalankanDeteksiAI);
    }
</script>
</body>
</html>
